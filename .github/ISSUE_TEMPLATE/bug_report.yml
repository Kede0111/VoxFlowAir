name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. The diagnostics report (Settings › Diagnostics › Generate Report) answers most of our first questions: please attach it.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Load a preset with …
        2. Start the engine
        3. …
  - type: input
    id: voxflowair
    attributes:
      label: VoxFlowAir version
      description: Settings › About.
      placeholder: "1.0.0 (1)"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: "macOS 26.1, MacBook Pro M3"
    validations:
      required: true
  - type: input
    id: audio
    attributes:
      label: Audio devices
      description: Microphone or interface, headphones output, virtual output (BlackHole or VoxFlowAir Micro), sample rate and buffer size.
  - type: textarea
    id: plugins
    attributes:
      label: Plugins involved
      description: Audio Units in the chain (name, manufacturer, version) and the load mode (isolated process or inside VoxFlowAir).
  - type: textarea
    id: logs
    attributes:
      label: Diagnostics report or logs
      description: Paste the diagnostics report, or relevant lines of ~/Library/Logs/VoxFlowAir/VoxFlowAir.log. Crash reports are in ~/Library/Logs/DiagnosticReports.
      render: text
