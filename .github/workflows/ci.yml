name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    # VoxFlowAir runs on macOS 26 but is built with Xcode 27 (macOS 27 SDK).
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DERIVED: ${{ github.workspace }}/build/DerivedData
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)"
          [ -n "$XCODE" ] || { echo "::error::Xcode 27 is not installed on this runner image"; exit 1; }
          sudo xcode-select -s "$XCODE"

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Build the driver and its tests
        run: xcodebuild -project VoxFlowAir.xcodeproj -scheme VoxFlowAirDriver -configuration Debug -derivedDataPath "$DERIVED" build

      - name: Build the app
        run: xcodebuild -project VoxFlowAir.xcodeproj -scheme VoxFlowAir -configuration Debug -derivedDataPath "$DERIVED" build

      - name: Build the developer tool
        run: xcodebuild -project VoxFlowAir.xcodeproj -scheme VoxFlowAirTool -configuration Debug -derivedDataPath "$DERIVED" build

      - name: Engine tests
        # Hardware tests only run with VOXFLOWAIR_HW=1, so no microphone or audio device is needed here.
        run: xcodebuild -project VoxFlowAir.xcodeproj -scheme VoxFlowAir -configuration Debug -derivedDataPath "$DERIVED" test

      - name: Driver tests (without installing the driver)
        run: |
          P="$DERIVED/Build/Products/Debug"
          "$P/VoxFlowAirDriverTests" "$P/VoxFlowAirDriver.driver"
